<style>
/* Layout: één kolom als telefoon-app; donkere petrol ondergrond, oker accent-cirkels zoals in de CX-deck. */
:root{
  --bg:#173a42;          /* petrol, zoals de slides */
  --bg-raised:#1e4851;   /* kaart */
  --bg-sunk:#122f36;     /* invoerveld */
  --fg:#ffffff;
  --fg-soft:#c9dcdf;
  --fg-mute:#8fb0b5;
  --accent:#e8ab4f;      /* oker cirkels */
  --accent-ink:#173a42;  /* tekst op oker */
  --mint:#5fbfa9;        /* cursieve slotzin */
  --line:rgba(255,255,255,.10);
  --warn:#f2c48a;
  --font:"Avenir Next","Avenir","Nunito Sans",-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--font);font-size:16px;line-height:1.45;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:10}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 40px;display:flex;flex-direction:column;gap:22px}
h1{font-size:2.1rem;line-height:1.08;font-weight:600;letter-spacing:-.01em;margin:0;text-wrap:balance}
.sub{margin:6px 0 0;font-style:italic;color:var(--fg-soft);font-size:1rem}
.search{display:flex;gap:8px}
.search input{flex:1;min-width:0;font:inherit;font-size:1.05rem;color:var(--fg);background:var(--bg-sunk);border:1px solid var(--line);border-radius:14px;padding:14px 16px;outline:none;-webkit-appearance:none}
.search input::placeholder{color:var(--fg-mute)}
.search input:focus{border-color:var(--accent)}
.search button{font:inherit;font-weight:600;color:var(--fg);background:transparent;border:1px solid var(--line);border-radius:14px;padding:0 16px;cursor:pointer}
.btn-main{font:inherit;font-weight:700;font-size:1.1rem;color:var(--accent-ink);background:var(--accent);border:0;border-radius:999px;padding:16px 22px;display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;width:100%}
.btn-main .pct{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--accent-ink);color:var(--accent);font-size:.95rem}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:2px solid var(--mint);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;font:inherit;font-size:.9rem;color:var(--fg-soft);background:transparent;border:1px solid var(--line);border-radius:999px;padding:7px 13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.status{font-size:.95rem;color:var(--fg-soft);margin:0}
.status strong{color:var(--fg)}
.msg{background:var(--bg-raised);border-radius:16px;padding:18px;display:flex;gap:14px;align-items:flex-start}
.msg .dot{flex:none;width:44px;height:44px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:1.2rem}
.msg p{margin:0}
.msg .small{color:var(--fg-mute);font-size:.9rem;margin-top:6px}
.list{display:flex;flex-direction:column;gap:12px;margin:0;padding:0;list-style:none}
.card{background:var(--bg-raised);border-radius:16px;padding:16px;display:grid;grid-template-columns:64px 1fr;gap:14px;align-items:start}
.card.low{opacity:.75}
.badge{width:64px;height:64px;border-radius:50%;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums;line-height:1;text-align:center}
.badge small{display:block;font-size:.62rem;font-weight:600;letter-spacing:.04em;margin-top:2px}
.card.low .badge{background:transparent;border:2px solid var(--fg-mute);color:var(--fg-soft)}
.body{min-width:0;display:flex;flex-direction:column;gap:6px}
.top{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.prod{font-weight:600;font-size:1.05rem;line-height:1.25}
.store{flex:none;font-size:.78rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
.desc{color:var(--fg-soft);font-size:.92rem}
.price{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-variant-numeric:tabular-nums}
.price .deal{font-weight:700;font-size:1.05rem}
.price .was{color:var(--fg-mute);text-decoration:line-through;font-size:.9rem}
.meta{display:flex;flex-wrap:wrap;gap:6px;font-size:.82rem}
.tag{border:1px solid var(--line);border-radius:999px;padding:3px 9px;color:var(--fg-soft)}
.tag.soon{border-color:var(--mint);color:var(--mint)}
.tag.last{border-color:var(--warn);color:var(--warn)}
.note{font-size:.85rem;color:var(--fg-mute);font-style:italic}
details{font-size:.88rem;color:var(--fg-soft)}
summary{cursor:pointer;color:var(--fg);font-weight:600;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"+ ";color:var(--accent)}
details[open] summary::before{content:"– "}
details ul{margin:6px 0 0;padding:0;list-style:none;display:flex;flex-direction:column;gap:3px}
details li{display:flex;justify-content:space-between;gap:10px}
details li span:last-child{flex:none;color:var(--fg-mute);font-variant-numeric:tabular-nums}
.section-h{font-size:.8rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--fg-mute);margin:6px 0 -4px}
footer{font-style:italic;color:var(--mint);font-size:.92rem;text-align:center;text-wrap:balance}
footer .upd{display:block;font-style:normal;color:var(--fg-mute);font-size:.82rem;margin-top:4px}
@media (prefers-reduced-motion:no-preference){.card{animation:in .25s ease both}@keyframes in{from{transform:translateY(4px)}to{transform:none}}}
</style>

<script>
(() => {
  const MIN = 25;
  const $ = s => document.querySelector(s);
  const state = { offers: [], lijst: null, winkels: {}, mode: 'all', query: '', store: 'Alle', ready: false };

  const norm = s => (s || '').toString().toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9% ]+/g, ' ').replace(/\s+/g, ' ').trim();
  const todayISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); };
  const DAYS = ['zo','ma','di','wo','do','vr','za'], MONTHS = ['jan','feb','mrt','apr','mei','jun','jul','aug','sep','okt','nov','dec'];
  const fmtDate = iso => { if (!iso) return ''; const [y,m,d] = iso.split('-').map(Number); const dt = new Date(y, m-1, d); return DAYS[dt.getDay()] + ' ' + d + ' ' + MONTHS[m-1]; };
  const daysUntil = iso => { const [y,m,d] = iso.split('-').map(Number); const t = new Date(); t.setHours(0,0,0,0); return Math.round((new Date(y,m-1,d) - t) / 864e5); };
  const esc = s => (s ?? '').toString().replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

  function liveOffers() {
    const t = todayISO();
    return state.offers.filter(o => !o.tot || o.tot >= t);
  }
  const isGood = o => typeof o.korting === 'number' && o.korting >= MIN;

  function haystack(o) { return norm([o.product, o.merk, o.omschrijving, o.groep, (o.termen || []).join(' ')].join(' ')); }
  function matches(o, q) { const h = haystack(o); return norm(q).split(' ').every(w => h.includes(w)); }

  function listItemFor(q) {
    if (!state.lijst || !Array.isArray(state.lijst.producten)) return null;
    const nq = norm(q);
    return state.lijst.producten.find(p => {
      const h = norm([p.naam, p.groep, (p.termen || []).join(' ')].join(' '));
      return nq.split(' ').every(w => h.includes(w)) || h.split(' ').some(w => w.length > 3 && nq.includes(w));
    }) || null;
  }

  function card(o) {
    const good = isGood(o);
    const t = todayISO();
    const tags = [];
    if (o.van && o.van > t) tags.push(`<span class="tag soon">vanaf ${fmtDate(o.van)}</span>`);
    if (o.tot) {
      const n = daysUntil(o.tot);
      tags.push(`<span class="tag ${n <= 1 ? 'last' : ''}">${n === 0 ? 'alleen vandaag' : 't/m ' + fmtDate(o.tot)}</span>`);
    }
    if (o.actie) tags.push(`<span class="tag">${esc(o.actie)}</span>`);
    const w = state.winkels[o.winkel];
    let vest = '';
    if (w && Array.isArray(w.vestigingen) && w.vestigingen.length) {
      const items = w.vestigingen.map(v => `<li><span>${esc(v.naam)}</span><span>${esc(v.km)} km</span></li>`).join('');
      vest = `<details><summary>${esc(o.vestiging || ('alle ' + w.vestigingen.length + ' vestigingen'))}</summary><ul>${items}</ul></details>`;
    } else if (o.vestiging) {
      vest = `<div class="desc">${esc(o.vestiging)}</div>`;
    }
    const pct = typeof o.korting === 'number' ? Math.round(o.korting) + '%' : '?';
    return `<li class="card ${good ? '' : 'low'}">
      <div class="badge" aria-label="${pct} korting">${pct}<small>KORTING</small></div>
      <div class="body">
        <div class="top"><span class="prod">${esc(o.product)}</span><span class="store">${esc(o.winkel)}</span></div>
        ${o.omschrijving ? `<div class="desc">${esc(o.omschrijving)}</div>` : ''}
        <div class="price">${o.actieprijs ? `<span class="deal">${esc(o.actieprijs)}</span>` : ''}${o.normaal ? `<span class="was">${esc(o.normaal)}</span>` : ''}</div>
        <div class="meta">${tags.join('')}</div>
        ${o.opmerking ? `<div class="note">${esc(o.opmerking)}</div>` : ''}
        ${vest}
      </div>
    </li>`;
  }

  function sortOffers(a) {
    return a.slice().sort((x, y) => (y.korting ?? -1) - (x.korting ?? -1) || (x.product || '').localeCompare(y.product || ''));
  }

  function renderChips(list) {
    const stores = ['Alle', ...Array.from(new Set(list.map(o => o.winkel))).sort()];
    if (!stores.includes(state.store)) state.store = 'Alle';
    const el = $('#chips');
    el.hidden = list.length === 0;
    el.innerHTML = stores.map(s => `<button type="button" class="chip" aria-pressed="${s === state.store}" data-store="${esc(s)}">${esc(s)}</button>`).join('');
  }

  function render() {
    const res = $('#results'), status = $('#status');
    if (!state.ready) return;
    const live = liveOffers();

    if (state.mode === 'all') {
      const good = live.filter(isGood);
      renderChips(good);
      const shown = sortOffers(good.filter(o => state.store === 'Alle' || o.winkel === state.store));
      if (!good.length) {
        status.innerHTML = '';
        res.innerHTML = `<div class="msg"><div class="dot">0</div><div><p>Er zijn op dit moment geen aanbiedingen van ${MIN}% of meer voor producten op je lijst.</p></div></div>`;
        return;
      }
      status.innerHTML = `<strong>${shown.length}</strong> ${shown.length === 1 ? 'aanbieding' : 'aanbiedingen'} van ${MIN}% of meer${state.store !== 'Alle' ? ' bij ' + esc(state.store) : ''}, hoogste korting eerst`;
      res.innerHTML = `<ul class="list">${shown.map(card).join('')}</ul>`;
      return;
    }

    // zoekmodus
    $('#chips').hidden = true;
    const q = state.query;
    const hits = live.filter(o => matches(o, q));
    const good = sortOffers(hits.filter(isGood));
    const low = sortOffers(hits.filter(o => !isGood(o)));
    const onList = listItemFor(q);
    let html = '';
    if (good.length) {
      status.innerHTML = `<strong>${good.length}</strong> ${good.length === 1 ? 'aanbieding' : 'aanbiedingen'} voor “${esc(q)}”`;
      html += `<ul class="list">${good.map(card).join('')}</ul>`;
    } else {
      status.innerHTML = '';
      const name = onList ? onList.naam : q;
      const line = low.length
        ? `Geen aanbiedingen van ${MIN}% of meer voor <strong>${esc(name)}</strong>. Er ${low.length === 1 ? 'is wel een actie' : 'zijn wel acties'} met minder korting.`
        : `Geen aanbiedingen voor <strong>${esc(name)}</strong> (ook niet onder ${MIN}%).`;
      const extra = onList ? '' : `<p class="small">“${esc(q)}” staat niet op je boodschappenlijst, dus wordt niet bijgehouden.</p>`;
      html += `<div class="msg"><div class="dot">–</div><div><p>${line}</p>${extra}</div></div>`;
      if (low.length) html += `<p class="section-h">Onder de ${MIN}%</p><ul class="list">${low.map(card).join('')}</ul>`;
    }
    res.innerHTML = html;
  }

  $('#showAll').addEventListener('click', () => { state.mode = 'all'; state.query = ''; $('#q').value = ''; render(); });
  $('#searchForm').addEventListener('submit', e => {
    e.preventDefault();
    const q = $('#q').value.trim();
    if (!q) { state.mode = 'all'; render(); return; }
    state.mode = 'search'; state.query = q; $('#q').blur(); render();
  });
  $('#chips').addEventListener('click', e => {
    const b = e.target.closest('.chip'); if (!b) return;
    state.store = b.dataset.store; render();
  });

  function setUpdated() {
    const u = state.lijst && state.lijst.bijgewerkt;
    $('#updated').textContent = u ? 'Laatst bijgewerkt: ' + fmtDate(u) + (state.lijst.bron ? ' · ' + state.lijst.bron : '') : '';
  }

  function start() {
    let data = null;
    try { data = JSON.parse(document.getElementById('vv-data').textContent); } catch (e) { data = null; }
    if (!data) { $('#status').textContent = 'De aanbiedingen konden niet geladen worden. Herlaad de app.'; return; }
    state.offers = data.aanbiedingen || [];
    state.lijst = data.lijst || null;
    state.winkels = data.winkels || {};
    state.ready = true;
    setUpdated();
    render();
  }
  start();
})();
</script>
</body></html>
